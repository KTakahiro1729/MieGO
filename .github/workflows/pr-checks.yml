name: Pull request checks
on:
  pull_request:
    branches: [main, release, 'feature/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium for the layout test
        run: npx playwright install --with-deps chromium
      - name: Test and build browser KataGo bundle
        run: npm test
      - name: Check client JavaScript syntax
        run: |
          node --check src/worker.mjs
          node --check public/p2p-session.mjs
          node --check public/p2p-transport.mjs
          node --check public/app.mjs
          node --check public/appearance-settings.mjs
          node --check public/help-sheet.mjs
          node --check public/share-images.mjs
          node --check public/confirm-retap.mjs
          node --check public/clipboard.mjs
          node --check public/texts.mjs
          node --check public/board-renderer.mjs
          node --check public/history-panel.mjs
          node --check public/history-navigation.mjs
          node --check public/ai-opponent.mjs
          node --check public/invite.mjs
