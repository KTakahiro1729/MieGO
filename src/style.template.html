<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1119">
  <title>{{playStyle.pageTitle}}</title>
  <meta name="description" content="{{playStyle.pageDescription}}">
  <link rel="canonical" href="https://miego.fun/style">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/icon-96.png" type="image/png" sizes="96x96">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="MieGO">
  <meta property="og:locale" content="ja_JP">
  <meta property="og:url" content="https://miego.fun/style">
  <meta property="og:title" content="{{playStyle.pageTitle}}">
  <meta property="og:description" content="{{playStyle.pageDescription}}">
  <meta property="og:image" content="https://miego.fun/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/play-style-page.mjs"></script>
</head>
<body class="style-page">
  <header class="topbar">
    <a class="brand style-brand" href="/">Mie<span>GO</span></a>
    <a class="style-back" href="/">{{playStyle.back}}</a>
  </header>
  <main class="style-main">
    <p class="style-kicker">{{playStyle.title}}</p>
    <section id="styleResult" class="style-result" aria-live="polite" hidden></section>
    <section id="styleCompat" class="style-result style-compat" aria-live="polite" hidden></section>
    <p id="styleIntro" class="style-intro">{{playStyle.intro}}</p>
    <section class="style-section">
      <h2>{{playStyle.axesTitle}}</h2>
      <ol id="styleAxes" class="style-axes"></ol>
    </section>
    <section class="style-section">
      <h2>{{playStyle.allTitle}}</h2>
      <ul id="styleTypes" class="style-types"></ul>
    </section>
    <p class="style-privacy">{{playStyle.privacy}}</p>
    <a class="style-cta" href="/">{{playStyle.playCta}}</a>
    <a class="style-cta secondary" href="/?open=history-style">{{playStyle.historyButton}}</a>
  </main>
</body>
</html>
